<script>
  const SUPABASE_URL = "https://azfcbwoxfepemsqsydgc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_XPgx-18pz3WeKdhCycPm5Q_ho3mHF4F";
  const CATEGORY = "video";

  let allPricingRows = [];
  let productInfoBySlug = {};
  let exchangeRate = null;
  let currentAudience = "all";
  let currentSort = "default";
  let currentSearch = "";
  let selectedSlugs = new Set();

  async function fetchFromSupabase(path) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
      },
    });
    if (!res.ok) {
      throw new Error(`Supabaseからの取得に失敗しました (${res.status})`);
    }
    return res.json();
  }

  // ページ閲覧・クリックの記録(失敗しても表示には影響させない)
  function trackPageView(page) {
    fetch(`${SUPABASE_URL}/rest/v1/page_views`, {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json",
        Prefer: "return=minimal",
      },
      body: JSON.stringify({ page }),
    }).catch((e) => console.warn("ページビュー記録に失敗しました", e));
  }

  function trackProductClick(slug) {
    fetch(`${SUPABASE_URL}/rest/v1/product_clicks`, {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json",
        Prefer: "return=minimal",
      },
      body: JSON.stringify({ product_slug: slug }),
    }).catch((e) => console.warn("クリック記録に失敗しました", e));
  }

  function formatJPY(amountUsd, rate) {
    if (amountUsd == null || rate == null) return null;
    const jpy = amountUsd * rate;
    return `約¥${Math.round(jpy).toLocaleString("ja-JP")}`;
  }

  function formatChangeDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric" });
  }

  function faviconUrlFor(officialSite) {
    try {
      const domain = new URL(officialSite).hostname;
      return `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
    } catch {
      return "";
    }
  }

  function renderPriceChangeLog(changes) {
    const listEl = document.getElementById("price-change-list");

    if (!changes || changes.length === 0) {
      listEl.innerHTML = `<div class="no-change">現時点で記録されている価格改定はありません。</div>`;
      return;
    }

    let html = "";
    for (const c of changes) {
      const oldAmt = c.old_price_amount != null ? parseFloat(c.old_price_amount) : null;
      const newAmt = c.new_price_amount != null ? parseFloat(c.new_price_amount) : null;
      let badgeClass = "";
      let arrowSymbol = "→";
      if (oldAmt != null && newAmt != null) {
        if (newAmt > oldAmt) { badgeClass = "change-up"; arrowSymbol = "▲"; }
        else if (newAmt < oldAmt) { badgeClass = "change-down"; arrowSymbol = "▼"; }
      }

      html += `
        <div class="change-row">
          <div class="change-name">
            <span class="change-product">${c.product_name}</span>
            <span class="change-plan">${c.plan_name}</span>
          </div>
          <span class="change-badge ${badgeClass}">${arrowSymbol} ${c.old_price_text ?? "-"} → ${c.new_price_text ?? "-"}</span>
        </div>`;
    }
    listEl.innerHTML = html;
  }

  function renderProductCards() {
    const contentEl = document.getElementById("content");
    const noResultsEl = document.getElementById("no-results");

    const searchLower = currentSearch.trim().toLowerCase();
    const filteredRows = allPricingRows.filter((row) => {
      const audienceOk = currentAudience === "all" || row.audience === currentAudience;
      const searchOk = !searchLower || row.product_name.toLowerCase().includes(searchLower);
      return audienceOk && searchOk;
    });

    const grouped = {};
    for (const row of filteredRows) {
      if (!grouped[row.product_name]) grouped[row.product_name] = { slug: row.product_slug, plans: [] };
      grouped[row.product_name].plans.push(row);
    }

    let productEntries = Object.entries(grouped);

    if (productEntries.length === 0) {
      contentEl.innerHTML = "";
      noResultsEl.style.display = "block";
      return;
    }
    noResultsEl.style.display = "none";

    for (const [, group] of productEntries) {
      const paidPlans = group.plans.filter((p) => p.base_price_amount != null && p.base_price_amount > 0);
      const cheapest = paidPlans.sort((a, b) => a.base_price_amount - b.base_price_amount)[0];
      group._repPrice = cheapest ? cheapest.base_price_amount : null;
    }

    if (currentSort === "price-asc" || currentSort === "price-desc") {
      productEntries.sort(([, groupA], [, groupB]) => {
        const a = groupA._repPrice;
        const b = groupB._repPrice;
        if (a == null && b == null) return 0;
        if (a == null) return 1;
        if (b == null) return -1;
        return currentSort === "price-asc" ? a - b : b - a;
      });
    } else if (currentSort === "name-asc") {
      productEntries.sort(([nameA], [nameB]) => nameA.localeCompare(nameB, "ja"));
    }

    contentEl.innerHTML = "";
    for (const [productName, group] of productEntries) {
      const plans = group.plans;
      const info = productInfoBySlug[group.slug];
      const faviconSrc = info ? faviconUrlFor(info.official_site) : "";
      const tagline = info?.tagline;
      const prosCons = info?.pros_cons;
      const officialSite = info?.official_site;

      const card = document.createElement("div");
      card.className = "product-card";

      const cheapestPaid = plans
        .filter((p) => p.base_price_amount && p.base_price_amount > 0)
        .sort((a, b) => a.base_price_amount - b.base_price_amount)[0];

      let rowsHtml = "";
      for (const plan of plans) {
        const jpy = formatJPY(plan.base_price_amount, exchangeRate);
        const isCheapest = cheapestPaid && plan.plan_name === cheapestPaid.plan_name;
        rowsHtml += `
          <div class="plan-row">
            <span class="plan-name">${plan.plan_name}${isCheapest ? '<span class="badge">最安</span>' : ""}</span>
            <span class="price-cell">
              <span class="price-usd">${plan.raw_price_text ?? "-"}</span>
              ${jpy ? `<span class="price-jpy">${jpy}</span>` : ""}
            </span>
          </div>`;
      }

      const isChecked = selectedSlugs.has(group.slug);
      card.innerHTML = `
        <div class="product-header">
          ${faviconSrc ? (officialSite ? `<a href="${officialSite}" target="_blank" rel="noopener noreferrer" onclick="trackProductClick('${group.slug}')"><img class="product-favicon" src="${faviconSrc}" alt="${productName}のロゴ" loading="lazy" /></a>` : `<img class="product-favicon" src="${faviconSrc}" alt="${productName}のロゴ" loading="lazy" />`) : `<div class="product-favicon"></div>`}
          <div>
            <h3 class="product-title">${officialSite ? `<a href="${officialSite}" target="_blank" rel="noopener noreferrer" onclick="trackProductClick('${group.slug}')">${productName}</a>` : productName}</h3>
            ${tagline ? `<div class="product-tagline">${tagline}</div>` : ""}
            ${prosCons ? `<div class="product-proscons">${prosCons}</div>` : ""}
          </div>
        </div>
        ${rowsHtml}
        <div class="compare-checkbox-wrap">
          <label>
            <input type="checkbox" class="compare-checkbox" data-slug="${group.slug}" ${isChecked ? "checked" : ""} />
            比較リストに追加
          </label>
        </div>
      `;
      contentEl.appendChild(card);
      card.querySelector(".compare-checkbox").addEventListener("change", (e) => {
        if (e.target.checked) {
          selectedSlugs.add(group.slug);
        } else {
          selectedSlugs.delete(group.slug);
        }
        updateCompareBar();
      });
    }
  }

  function setupToolbar() {
    const toolbarEl = document.getElementById("toolbar");
    toolbarEl.style.display = "flex";

    const searchInputEl = document.getElementById("search-input");
    searchInputEl.style.display = "block";
    searchInputEl.addEventListener("input", (e) => {
      currentSearch = e.target.value;
      renderProductCards();
    });

    const filterButtons = document.querySelectorAll("#audience-filters .filter-btn");
    filterButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        filterButtons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentAudience = btn.dataset.audience;
        renderProductCards();
      });
    });

    document.getElementById("sort-select").addEventListener("change", (e) => {
      currentSort = e.target.value;
      renderProductCards();
    });
  }

  function updateCompareBar() {
    const bar = document.getElementById("compare-bar");
    const countText = document.getElementById("compare-count-text");
    if (selectedSlugs.size === 0) {
      bar.style.display = "none";
      return;
    }
    bar.style.display = "flex";
    countText.textContent = `${selectedSlugs.size}件選択中`;
  }

  function renderCompareOverlay() {
    const rowEl = document.getElementById("compare-row");
    const html = [...selectedSlugs].map((slug) => {
      const rows = allPricingRows.filter((r) => r.product_slug === slug);
      if (rows.length === 0) return "";
      const info = productInfoBySlug[slug];
      const name = rows[0].product_name;
      let planRows = "";
      for (const plan of rows) {
        const jpy = formatJPY(plan.base_price_amount, exchangeRate);
        planRows += `
          <div class="plan-row" style="padding:6px 0;">
            <span class="plan-name" style="font-size:13.5px;">${plan.plan_name}</span>
            <span class="price-cell">
              <span class="price-usd" style="font-size:13.5px;">${plan.raw_price_text ?? "-"}</span>
              ${jpy ? `<span class="price-jpy" style="font-size:11px;">${jpy}</span>` : ""}
            </span>
          </div>`;
      }
      return `
        <div class="compare-card">
          <div class="compare-card-title">${name}</div>
          ${planRows}
          <button class="compare-remove-btn" data-slug="${slug}">比較から外す</button>
        </div>`;
    }).join("");
    rowEl.innerHTML = html;

    rowEl.querySelectorAll(".compare-remove-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        selectedSlugs.delete(btn.dataset.slug);
        updateCompareBar();
        renderCompareOverlay();
        renderProductCards();
        if (selectedSlugs.size === 0) {
          document.getElementById("compare-overlay").style.display = "none";
        }
      });
    });
  }

  function setupCompareBar() {
    document.getElementById("compare-clear-btn").addEventListener("click", () => {
      selectedSlugs.clear();
      updateCompareBar();
      renderProductCards();
      document.getElementById("compare-overlay").style.display = "none";
    });
    document.getElementById("compare-open-btn").addEventListener("click", () => {
      renderCompareOverlay();
      document.getElementById("compare-overlay").style.display = "block";
    });
    document.getElementById("compare-close-btn").addEventListener("click", () => {
      document.getElementById("compare-overlay").style.display = "none";
    });
  }

  async function main() {
    const statusEl = document.getElementById("status");
    const rateNoteEl = document.getElementById("rate-note");

    trackPageView(CATEGORY);

    try {
      const [pricing, rateRows, priceChanges, productInfo] = await Promise.all([
        fetchFromSupabase(`public_pricing_view?select=*&category=eq.${CATEGORY}`),
        fetchFromSupabase(
          "current_exchange_rate?base_currency=eq.USD&quote_currency=eq.JPY&select=*"
        ),
        fetchFromSupabase(`price_change_log?select=*&category=eq.${CATEGORY}&order=changed_at.desc&limit=20`),
        fetchFromSupabase("product_info?select=*"),
      ]);

      allPricingRows = pricing;
      exchangeRate = rateRows[0]?.rate ? parseFloat(rateRows[0].rate) : null;

      productInfoBySlug = {};
      for (const p of productInfo) {
        productInfoBySlug[p.slug] = p;
      }

      if (exchangeRate) {
        rateNoteEl.textContent = `為替レート: 1 USD ≈ ${exchangeRate.toFixed(2)} 円 (${new Date(
          rateRows[0].fetched_at
        ).toLocaleDateString("ja-JP")}時点)`;
      }

      renderPriceChangeLog(priceChanges);
      setupToolbar();
      setupCompareBar();
      renderProductCards();

      statusEl.style.display = "none";
    } catch (err) {
      console.error(err);
      statusEl.textContent = `データの取得に失敗しました: ${err.message}`;
      statusEl.classList.add("error");
    }
  }

  main();
</script>

</body>
</html>
