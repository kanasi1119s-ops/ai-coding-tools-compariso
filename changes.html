<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>価格変化ログ — AIツール相場</title>
<style>
  :root {
    --bg: #fafafa;
    --ink: #111111;
    --ink-soft: #6b7280;
    --ink-mute: #9ca3af;
    --line: #e5e7eb;
    --line-soft: #f0f0f0;
    --card-bg: #ffffff;
    --accent: #4f46e5;
    --accent-bg: #eef2ff;
    --up-bg: #fee2e2;
    --up-ink: #b91c1c;
    --down-bg: #dcfce7;
    --down-ink: #15803d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
    line-height: 1.7;
    font-size: 17px;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 20px 80px;
  }
  .back-link {
    display: inline-block;
    margin-bottom: 20px;
    color: var(--accent);
    font-size: 14.5px;
    font-weight: 600;
    text-decoration: none;
  }
  header h1 {
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 8px;
  }
  header p {
    color: var(--ink-soft);
    font-size: 15px;
    margin: 0 0 16px;
  }
  .cross-link {
    display: inline-block;
    background: var(--accent-bg);
    color: var(--accent);
    font-size: 13.5px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
    text-decoration: none;
    margin-bottom: 20px;
  }

  .filter-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .filter-btn {
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    background: var(--card-bg);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  #status { color: var(--ink-soft); font-size: 15px; }
  #no-results {
    display: none;
    color: var(--ink-mute);
    font-size: 15px;
    padding: 12px 0;
  }

  .change-card {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .change-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line-soft);
    font-size: 14.5px;
    flex-wrap: wrap;
  }
  .change-row:last-child { border-bottom: none; }
  .change-name { min-width: 0; }
  .change-product { font-weight: 700; }
  .change-plan { color: var(--ink-mute); font-size: 13px; margin-left: 4px; }
  .change-genre {
    display: block;
    color: var(--ink-mute);
    font-size: 11.5px;
    margin-top: 2px;
  }
  .change-badge {
    font-size: 12.5px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .change-up { background: var(--up-bg); color: var(--up-ink); }
  .change-down { background: var(--down-bg); color: var(--down-ink); }
  .change-date {
    color: var(--ink-mute);
    font-size: 11.5px;
    white-space: nowrap;
    width: 100%;
    text-align: right;
    margin-top: 2px;
  }
</style>
</head>
<body>

<main>
  <a class="back-link" href="index.html">← トップに戻る</a>

  <header>
    <h1>価格変化ログ</h1>
    <p>62サービス・4ジャンル分の価格改定を、毎日の自動収集データから横断で検出して一覧にしています。</p>
  </header>

  <a class="cross-link" href="events.html">改名・買収などの「業界再編ログ」はこちら →</a>

  <div id="status">読み込み中...</div>

  <div class="filter-group" id="filters" style="display:none;">
    <button class="filter-btn active" data-category="all">すべて</button>
    <button class="filter-btn" data-category="coding">コーディング</button>
    <button class="filter-btn" data-category="image">画像生成</button>
    <button class="filter-btn" data-category="video">動画生成</button>
    <button class="filter-btn" data-category="music">音楽生成</button>
  </div>
  <div id="no-results">現時点で記録されている価格改定はありません。</div>

  <div class="change-card" id="change-list"></div>
</main>

<script>
  const SUPABASE_URL = "https://azfcbwoxfepemsqsydgc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_XPgx-18pz3WeKdhCycPm5Q_ho3mHF4F";

  const CATEGORY_LABEL = {
    coding: "コーディング",
    image: "画像生成",
    video: "動画生成",
    music: "音楽生成",
  };

  let allChanges = [];
  let currentCategory = "all";

  async function fetchFromSupabase(path) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
      },
    });
    if (!res.ok) {
      throw new Error(`Supabaseからの取得に失敗しました (${res.status})`);
    }
    return res.json();
  }

  function formatChangeDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric" });
  }

  function renderChanges() {
    const listEl = document.getElementById("change-list");
    const noResultsEl = document.getElementById("no-results");

    const filtered =
      currentCategory === "all"
        ? allChanges
        : allChanges.filter((c) => c.category === currentCategory);

    if (filtered.length === 0) {
      listEl.innerHTML = "";
      noResultsEl.style.display = "block";
      return;
    }
    noResultsEl.style.display = "none";

    let html = "";
    for (const c of filtered) {
      const oldAmt = c.old_price_amount != null ? parseFloat(c.old_price_amount) : null;
      const newAmt = c.new_price_amount != null ? parseFloat(c.new_price_amount) : null;
      let badgeClass = "";
      let arrowSymbol = "→";
      if (oldAmt != null && newAmt != null) {
        if (newAmt > oldAmt) { badgeClass = "change-up"; arrowSymbol = "▲"; }
        else if (newAmt < oldAmt) { badgeClass = "change-down"; arrowSymbol = "▼"; }
      }

      html += `
        <div class="change-row">
          <div class="change-name">
            <span class="change-product">${c.product_name}</span>
            <span class="change-plan">${c.plan_name}</span>
            <span class="change-genre">${CATEGORY_LABEL[c.category] ?? c.category}</span>
          </div>
          <span class="change-badge ${badgeClass}">${arrowSymbol} ${c.old_price_text ?? "-"} → ${c.new_price_text ?? "-"}</span>
          <span class="change-date">${formatChangeDate(c.changed_at)}</span>
        </div>`;
    }
    listEl.innerHTML = html;
  }

  function setupFilters() {
    const filtersEl = document.getElementById("filters");
    filtersEl.style.display = "flex";

    const buttons = document.querySelectorAll("#filters .filter-btn");
    buttons.forEach((btn) => {
      btn.addEventListener("click", () => {
        buttons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentCategory = btn.dataset.category;
        renderChanges();
      });
    });
  }

  async function main() {
    const statusEl = document.getElementById("status");
    try {
      allChanges = await fetchFromSupabase("price_change_log?select=*&order=changed_at.desc&limit=100");
      setupFilters();
      renderChanges();
      statusEl.style.display = "none";
    } catch (err) {
      console.error(err);
      statusEl.textContent = `データの取得に失敗しました: ${err.message}`;
      statusEl.style.color = "#b91c1c";
    }
  }

  main();
</script>

</body>
</html>
