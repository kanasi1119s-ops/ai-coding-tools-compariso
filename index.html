<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AIコーディングツール比較</title>
<style>
  :root {
    --bg: #fafaf8;
    --ink: #1a1a1a;
    --ink-soft: #6b6b68;
    --line: #e4e2dc;
    --accent: #2f5eff;
    --card-bg: #ffffff;
    --up: #b3261e;
    --down: #1e7a34;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    line-height: 1.6;
  }
  header {
    padding: 48px 24px 32px;
    max-width: 880px;
    margin: 0 auto;
  }
  header h1 {
    font-size: 28px;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  header p {
    color: var(--ink-soft);
    margin: 0;
    font-size: 15px;
  }
  #rate-note {
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 12px;
  }
  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  /* 価格改定履歴セクション */
  #price-change-section {
    max-width: 880px;
    margin: 0 auto;
    padding: 0 24px 32px;
  }
  #price-change-section h2 {
    font-size: 18px;
    margin: 0 0 12px;
  }
  .change-card {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .change-row {
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .change-row:last-child {
    border-bottom: none;
  }
  .change-left {
    min-width: 0;
  }
  .change-product {
    font-weight: 600;
  }
  .change-plan {
    color: var(--ink-soft);
    font-size: 13px;
    margin-left: 6px;
  }
  .change-price {
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    font-size: 13px;
  }
  .change-arrow {
    color: var(--ink-soft);
    margin: 0 4px;
  }
  .change-date {
    color: var(--ink-soft);
    font-size: 12px;
    white-space: nowrap;
  }
  .change-up { color: var(--up); font-weight: 600; }
  .change-down { color: var(--down); font-weight: 600; }
  .no-change {
    padding: 20px;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .product-card {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 24px;
    overflow: hidden;
  }
  .product-card h2 {
    font-size: 18px;
    padding: 18px 20px;
    margin: 0;
    border-bottom: 1px solid var(--line);
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    text-align: left;
    padding: 12px 20px;
    font-size: 14px;
    border-bottom: 1px solid var(--line);
  }
  th {
    color: var(--ink-soft);
    font-weight: 500;
    font-size: 12px;
    text-transform: none;
  }
  tr:last-child td {
    border-bottom: none;
  }
  .price-usd {
    font-variant-numeric: tabular-nums;
  }
  .price-jpy {
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
    font-size: 13px;
  }
  .plan-name {
    font-weight: 600;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 8px;
  }
  #status {
    max-width: 880px;
    margin: 0 auto;
    padding: 0 24px;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .error {
    color: #b3261e;
  }
</style>
</head>
<body>

<header>
  <h1>AIコーディングツール比較</h1>
  <p>主要なAIコーディングアシスタントの料金プランを自動収集し、毎日更新しています。</p>
  <div id="rate-note"></div>
</header>

<div id="status">読み込み中...</div>

<section id="price-change-section">
  <h2>価格改定履歴</h2>
  <div class="change-card" id="price-change-list"></div>
</section>

<main id="content"></main>

<script>
  const SUPABASE_URL = "https://azfcbwoxfepemsqsydgc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_XPgx-18pz3WeKdhCycPm5Q_ho3mHF4F";

  async function fetchFromSupabase(path) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
      },
    });
    if (!res.ok) {
      throw new Error(`Supabaseからの取得に失敗しました (${res.status})`);
    }
    return res.json();
  }

  function formatJPY(amountUsd, rate) {
    if (amountUsd == null || rate == null) return null;
    const jpy = amountUsd * rate;
    return `¥${Math.round(jpy).toLocaleString("ja-JP")}`;
  }

  function formatChangeDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric" });
  }

  function renderPriceChangeLog(changes) {
    const listEl = document.getElementById("price-change-list");

    if (!changes || changes.length === 0) {
      listEl.innerHTML = `<div class="no-change">現時点で記録されている価格改定はありません。</div>`;
      return;
    }

    let html = "";
    for (const c of changes) {
      const oldAmt = c.old_price_amount != null ? parseFloat(c.old_price_amount) : null;
      const newAmt = c.new_price_amount != null ? parseFloat(c.new_price_amount) : null;
      let direction = "";
      if (oldAmt != null && newAmt != null) {
        if (newAmt > oldAmt) direction = "change-up";
        else if (newAmt < oldAmt) direction = "change-down";
      }
      const arrowSymbol = direction === "change-up" ? "▲" : direction === "change-down" ? "▼" : "→";

      html += `
        <div class="change-row">
          <div class="change-left">
            <span class="change-product">${c.product_name}</span>
            <span class="change-plan">${c.plan_name}</span>
          </div>
          <div class="change-price">
            ${c.old_price_text ?? "-"}
            <span class="change-arrow ${direction}">${arrowSymbol}</span>
            <span class="${direction}">${c.new_price_text ?? "-"}</span>
          </div>
          <div class="change-date">${formatChangeDate(c.changed_at)}</div>
        </div>`;
    }
    listEl.innerHTML = html;
  }

  async function main() {
    const statusEl = document.getElementById("status");
    const contentEl = document.getElementById("content");
    const rateNoteEl = document.getElementById("rate-note");

    try {
      const [pricing, rateRows, priceChanges] = await Promise.all([
        fetchFromSupabase("public_pricing_view?select=*"),
        fetchFromSupabase(
          "current_exchange_rate?base_currency=eq.USD&quote_currency=eq.JPY&select=*"
        ),
        fetchFromSupabase("price_change_log?select=*&order=changed_at.desc&limit=20"),
      ]);

      const rate = rateRows[0]?.rate ? parseFloat(rateRows[0].rate) : null;

      if (rate) {
        rateNoteEl.textContent = `為替レート: 1 USD ≈ ${rate.toFixed(2)} 円 (${new Date(
          rateRows[0].fetched_at
        ).toLocaleDateString("ja-JP")}時点)`;
      }

      renderPriceChangeLog(priceChanges);

      const grouped = {};
      for (const row of pricing) {
        if (!grouped[row.product_name]) grouped[row.product_name] = [];
        grouped[row.product_name].push(row);
      }

      contentEl.innerHTML = "";
      for (const [productName, plans] of Object.entries(grouped)) {
        const card = document.createElement("div");
        card.className = "product-card";

        const cheapestPaid = plans
          .filter((p) => p.base_price_amount && p.base_price_amount > 0)
          .sort((a, b) => a.base_price_amount - b.base_price_amount)[0];

        let rowsHtml = "";
        for (const plan of plans) {
          const jpy = formatJPY(plan.base_price_amount, rate);
          const isCheapest = cheapestPaid && plan.plan_name === cheapestPaid.plan_name;
          rowsHtml += `
            <tr>
              <td class="plan-name">${plan.plan_name}${
                isCheapest ? '<span class="badge">最安</span>' : ""
              }</td>
              <td class="price-usd">${plan.raw_price_text ?? "-"}</td>
              <td class="price-jpy">${jpy ? `約 ${jpy}` : "-"}</td>
            </tr>`;
        }

        card.innerHTML = `
          <h2>${productName}</h2>
          <table>
            <thead>
              <tr>
                <th>プラン</th>
                <th>価格(USD)</th>
                <th>価格(参考・日本円)</th>
              </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        `;
        contentEl.appendChild(card);
      }

      statusEl.textContent = "";
    } catch (err) {
      console.error(err);
      statusEl.textContent = `データの取得に失敗しました: ${err.message}`;
      statusEl.classList.add("error");
    }
  }

  main();
</script>

</body>
</html>
