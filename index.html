<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AIツール相場 — コーディングツール比較</title>
<style>
  :root {
    --bg: #fafafa;
    --ink: #111111;
    --ink-soft: #6b7280;
    --ink-mute: #9ca3af;
    --line: #e5e7eb;
    --line-soft: #f0f0f0;
    --card-bg: #ffffff;
    --accent: #4f46e5;
    --accent-bg: #eef2ff;
    --up-bg: #fee2e2;
    --up-ink: #b91c1c;
    --down-bg: #dcfce7;
    --down-ink: #15803d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
    line-height: 1.6;
    font-size: 17px;
  }
  main, header, #toolbar-wrap, #nav-wrap {
    max-width: 720px;
    margin: 0 auto;
  }

  /* ジャンル切り替えナビ */
  #nav-wrap { padding: 16px 20px 0; }
  .genre-nav {
    display: flex;
    gap: 8px;
    background: var(--accent-bg);
    padding: 6px;
    border-radius: 14px;
  }
  .genre-nav a {
    flex: 1;
    text-align: center;
    text-decoration: none;
    font-size: 15px;
    font-weight: 700;
    padding: 12px 10px;
    border-radius: 10px;
    border: none;
    color: var(--accent);
    background: transparent;
  }
  .genre-nav a.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 6px rgba(79, 70, 229, 0.35);
  }

  header { padding: 20px 20px 24px; }
  header h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
    line-height: 1.35;
  }
  header .subcopy {
    color: var(--ink-soft);
    margin: 0;
    font-size: 16px;
    max-width: 520px;
  }
  header .page-title {
    color: var(--ink-mute);
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0 0 10px;
  }
  #rate-note {
    font-size: 13.5px;
    color: var(--ink-mute);
    margin-top: 14px;
  }

  #status {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px;
    color: var(--ink-soft);
    font-size: 15.5px;
  }
  .error { color: var(--up-ink); }

  #price-change-section {
    padding: 0 20px 20px;
    max-width: 720px;
    margin: 0 auto;
  }
  .change-card {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  #price-change-section h2 {
    font-size: 15.5px;
    font-weight: 600;
    color: #374151;
    margin: 0;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line-soft);
  }
  .change-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line-soft);
    font-size: 14.5px;
    flex-wrap: wrap;
  }
  .change-row:last-child { border-bottom: none; }
  .change-name { min-width: 0; }
  .change-product { font-weight: 600; }
  .change-plan { color: var(--ink-mute); font-size: 13.5px; margin-left: 4px; }
  .change-badge {
    font-size: 13.5px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .change-up { background: var(--up-bg); color: var(--up-ink); }
  .change-down { background: var(--down-bg); color: var(--down-ink); }
  .no-change {
    padding: 16px;
    color: var(--ink-mute);
    font-size: 14.5px;
  }

  #toolbar-wrap { padding: 0 20px 16px; }
  #toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-btn {
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    background: var(--card-bg);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .sort-select {
    font-family: inherit;
    font-size: 14.5px;
    background: var(--card-bg);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 6px 10px;
    border-radius: 8px;
  }
  #no-results {
    display: none;
    color: var(--ink-mute);
    font-size: 15.5px;
    padding: 12px 20px 24px;
    max-width: 720px;
    margin: 0 auto;
  }

  main { padding: 0 20px 80px; }
  .product-card {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 16px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
  }
  .product-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line-soft);
  }
  .product-favicon {
    width: 24px;
    height: 24px;
    border-radius: 5px;
    flex-shrink: 0;
    margin-top: 2px;
    background: var(--line-soft);
    object-fit: contain;
  }
  .product-title { font-weight: 700; font-size: 17px; }
  .product-title a {
    color: inherit;
    text-decoration: none;
  }
  .product-title a:hover {
    text-decoration: underline;
  }
  .product-tagline {
    color: var(--ink-soft);
    font-size: 14px;
    margin-top: 2px;
  }
  .product-proscons {
    color: var(--ink-mute);
    font-size: 13.5px;
    margin-top: 6px;
    line-height: 1.6;
  }
  .plan-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line-soft);
  }
  .plan-row:last-child { border-bottom: none; }
  .plan-row:nth-child(even) { background: #fdfdfd; }
  .plan-name { font-weight: 500; }
  .badge {
    background: var(--accent-bg);
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 5px;
    margin-left: 6px;
  }
  .price-cell { text-align: right; flex-shrink: 0; }
  .price-usd { font-weight: 700; display: block; }
  .price-jpy { font-size: 13px; color: var(--ink-mute); display: block; }
</style>
</head>
<body>

<div id="nav-wrap">
  <nav class="genre-nav">
    <a href="index.html" class="active">コーディング</a>
    <a href="image.html">画像生成</a>
    <a href="video.html">動画生成</a>
    <a href="music.html">音楽生成</a>
  </nav>
</div>

<header>
  <p class="page-title">AIツール相場</p>
  <h1>AIコーディングツールの価格、まとめて・毎日・自動で。</h1>
  <p class="subcopy">Cursor、Claude Code、GitHub Copilotなど17サービスの料金プランを横断比較。値上げ・値下げ・買収による統合まで自動で検知します。</p>
  <div id="rate-note"></div>
</header>

<div id="status">読み込み中...</div>

<section id="price-change-section">
  <div class="change-card">
    <h2>価格改定履歴</h2>
    <div id="price-change-list"></div>
  </div>
</section>

<div id="toolbar-wrap">
  <div id="toolbar" style="display: none;">
    <div class="filter-group" id="audience-filters">
      <button class="filter-btn active" data-audience="all">すべて</button>
      <button class="filter-btn" data-audience="individual">個人向け</button>
      <button class="filter-btn" data-audience="team">チーム向け</button>
      <button class="filter-btn" data-audience="enterprise">エンタープライズ</button>
    </div>
    <select class="sort-select" id="sort-select">
      <option value="default">並び順: デフォルト</option>
      <option value="price-asc">価格が安い順</option>
      <option value="price-desc">価格が高い順</option>
      <option value="name-asc">名前順(A→Z)</option>
    </select>
  </div>
</div>
<div id="no-results">条件に一致するプランがありません。</div>

<main id="content"></main>

<script>
  const SUPABASE_URL = "https://azfcbwoxfepemsqsydgc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_XPgx-18pz3WeKdhCycPm5Q_ho3mHF4F";
  const CATEGORY = "coding";

  let allPricingRows = [];
  let productInfoBySlug = {};
  let exchangeRate = null;
  let currentAudience = "all";
  let currentSort = "default";

  async function fetchFromSupabase(path) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
      },
    });
    if (!res.ok) {
      throw new Error(`Supabaseからの取得に失敗しました (${res.status})`);
    }
    return res.json();
  }

  function formatJPY(amountUsd, rate) {
    if (amountUsd == null || rate == null) return null;
    const jpy = amountUsd * rate;
    return `約¥${Math.round(jpy).toLocaleString("ja-JP")}`;
  }

  function formatChangeDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric" });
  }

  function faviconUrlFor(officialSite) {
    try {
      const domain = new URL(officialSite).hostname;
      return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
    } catch {
      return "";
    }
  }

  function renderPriceChangeLog(changes) {
    const listEl = document.getElementById("price-change-list");

    if (!changes || changes.length === 0) {
      listEl.innerHTML = `<div class="no-change">現時点で記録されている価格改定はありません。</div>`;
      return;
    }

    let html = "";
    for (const c of changes) {
      const oldAmt = c.old_price_amount != null ? parseFloat(c.old_price_amount) : null;
      const newAmt = c.new_price_amount != null ? parseFloat(c.new_price_amount) : null;
      let badgeClass = "";
      let arrowSymbol = "→";
      if (oldAmt != null && newAmt != null) {
        if (newAmt > oldAmt) { badgeClass = "change-up"; arrowSymbol = "▲"; }
        else if (newAmt < oldAmt) { badgeClass = "change-down"; arrowSymbol = "▼"; }
      }

      html += `
        <div class="change-row">
          <div class="change-name">
            <span class="change-product">${c.product_name}</span>
            <span class="change-plan">${c.plan_name}</span>
          </div>
          <span class="change-badge ${badgeClass}">${arrowSymbol} ${c.old_price_text ?? "-"} → ${c.new_price_text ?? "-"}</span>
        </div>`;
    }
    listEl.innerHTML = html;
  }

  function renderProductCards() {
    const contentEl = document.getElementById("content");
    const noResultsEl = document.getElementById("no-results");

    const filteredRows =
      currentAudience === "all"
        ? allPricingRows
        : allPricingRows.filter((row) => row.audience === currentAudience);

    const grouped = {};
    for (const row of filteredRows) {
      if (!grouped[row.product_name]) grouped[row.product_name] = { slug: row.product_slug, plans: [] };
      grouped[row.product_name].plans.push(row);
    }

    let productEntries = Object.entries(grouped);

    if (productEntries.length === 0) {
      contentEl.innerHTML = "";
      noResultsEl.style.display = "block";
      return;
    }
    noResultsEl.style.display = "none";

    for (const [, group] of productEntries) {
      const paidPlans = group.plans.filter((p) => p.base_price_amount != null && p.base_price_amount > 0);
      const cheapest = paidPlans.sort((a, b) => a.base_price_amount - b.base_price_amount)[0];
      group._repPrice = cheapest ? cheapest.base_price_amount : null;
    }

    if (currentSort === "price-asc" || currentSort === "price-desc") {
      productEntries.sort(([, groupA], [, groupB]) => {
        const a = groupA._repPrice;
        const b = groupB._repPrice;
        if (a == null && b == null) return 0;
        if (a == null) return 1;
        if (b == null) return -1;
        return currentSort === "price-asc" ? a - b : b - a;
      });
    } else if (currentSort === "name-asc") {
      productEntries.sort(([nameA], [nameB]) => nameA.localeCompare(nameB, "ja"));
    }

    contentEl.innerHTML = "";
    for (const [productName, group] of productEntries) {
      const plans = group.plans;
      const info = productInfoBySlug[group.slug];
      const faviconSrc = info ? faviconUrlFor(info.official_site) : "";
      const tagline = info?.tagline;
      const prosCons = info?.pros_cons;
      const officialSite = info?.official_site;

      const card = document.createElement("div");
      card.className = "product-card";

      const cheapestPaid = plans
        .filter((p) => p.base_price_amount && p.base_price_amount > 0)
        .sort((a, b) => a.base_price_amount - b.base_price_amount)[0];

      let rowsHtml = "";
      for (const plan of plans) {
        const jpy = formatJPY(plan.base_price_amount, exchangeRate);
        const isCheapest = cheapestPaid && plan.plan_name === cheapestPaid.plan_name;
        rowsHtml += `
          <div class="plan-row">
            <span class="plan-name">${plan.plan_name}${isCheapest ? '<span class="badge">最安</span>' : ""}</span>
            <span class="price-cell">
              <span class="price-usd">${plan.raw_price_text ?? "-"}</span>
              ${jpy ? `<span class="price-jpy">${jpy}</span>` : ""}
            </span>
          </div>`;
      }

      card.innerHTML = `
        <div class="product-header">
          ${faviconSrc ? `<img class="product-favicon" src="${faviconSrc}" alt="" loading="lazy" />` : `<div class="product-favicon"></div>`}
          <div>
            <div class="product-title">${officialSite ? `<a href="${officialSite}" target="_blank" rel="noopener noreferrer">${productName}</a>` : productName}</div>
            ${tagline ? `<div class="product-tagline">${tagline}</div>` : ""}
            ${prosCons ? `<div class="product-proscons">${prosCons}</div>` : ""}
          </div>
        </div>
        ${rowsHtml}
      `;
      contentEl.appendChild(card);
    }
  }

  function setupToolbar() {
    const toolbarEl = document.getElementById("toolbar");
    toolbarEl.style.display = "flex";

    const filterButtons = document.querySelectorAll("#audience-filters .filter-btn");
    filterButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        filterButtons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentAudience = btn.dataset.audience;
        renderProductCards();
      });
    });

    document.getElementById("sort-select").addEventListener("change", (e) => {
      currentSort = e.target.value;
      renderProductCards();
    });
  }

  async function main() {
    const statusEl = document.getElementById("status");
    const rateNoteEl = document.getElementById("rate-note");

    try {
      const [pricing, rateRows, priceChanges, productInfo] = await Promise.all([
        fetchFromSupabase(`public_pricing_view?select=*&category=eq.${CATEGORY}`),
        fetchFromSupabase(
          "current_exchange_rate?base_currency=eq.USD&quote_currency=eq.JPY&select=*"
        ),
        fetchFromSupabase(`price_change_log?select=*&category=eq.${CATEGORY}&order=changed_at.desc&limit=20`),
        fetchFromSupabase("product_info?select=*"),
      ]);

      allPricingRows = pricing;
      exchangeRate = rateRows[0]?.rate ? parseFloat(rateRows[0].rate) : null;

      productInfoBySlug = {};
      for (const p of productInfo) {
        productInfoBySlug[p.slug] = p;
      }

      if (exchangeRate) {
        rateNoteEl.textContent = `為替レート: 1 USD ≈ ${exchangeRate.toFixed(2)} 円 (${new Date(
          rateRows[0].fetched_at
        ).toLocaleDateString("ja-JP")}時点)`;
      }

      renderPriceChangeLog(priceChanges);
      setupToolbar();
      renderProductCards();

      statusEl.style.display = "none";
    } catch (err) {
      console.error(err);
      statusEl.textContent = `データの取得に失敗しました: ${err.message}`;
      statusEl.classList.add("error");
    }
  }

  main();
</script>

</body>
</html>
