name: Scrape Cursor Pricing

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 依存パッケージをインストール
        run: npm install

      - name: TypeScriptをビルド
        run: npm run build

      - name: Cursorの料金ページをスクレイピング
        run: npm run scrape:cursor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
