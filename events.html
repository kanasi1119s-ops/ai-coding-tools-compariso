<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>業界再編ログ — AIツール相場</title>
<style>
  :root {
    --bg: #fafafa;
    --ink: #111111;
    --ink-soft: #6b7280;
    --ink-mute: #9ca3af;
    --line: #e5e7eb;
    --line-soft: #f0f0f0;
    --card-bg: #ffffff;
    --accent: #4f46e5;
    --accent-bg: #eef2ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
    line-height: 1.7;
    font-size: 17px;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 20px 80px;
  }
  .back-link {
    display: inline-block;
    margin-bottom: 20px;
    color: var(--accent);
    font-size: 14.5px;
    font-weight: 600;
    text-decoration: none;
  }
  header h1 {
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 8px;
  }
  header p {
    color: var(--ink-soft);
    font-size: 15px;
    margin: 0 0 20px;
  }

  .filter-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .filter-btn {
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    background: var(--card-bg);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  #status { color: var(--ink-soft); font-size: 15px; }
  #no-results {
    display: none;
    color: var(--ink-mute);
    font-size: 15px;
    padding: 12px 0;
  }

  .event-card {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .event-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .event-date {
    color: var(--ink-mute);
    font-size: 13px;
    font-weight: 600;
  }
  .event-badge {
    background: var(--accent-bg);
    color: var(--accent);
    font-size: 11.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .event-title {
    font-weight: 700;
    font-size: 16.5px;
    margin: 0 0 6px;
  }
  .event-desc {
    color: var(--ink);
    font-size: 15px;
    margin: 0;
  }
</style>
</head>
<body>

<main>
  <a class="back-link" href="index.html">← トップに戻る</a>

  <header>
    <h1>業界再編ログ</h1>
    <p>ブランド名の変更、買収・統合、サービス終了など、単なる値上げ・値下げでは表せない「業界の動き」を記録しています。</p>
  </header>

  <div id="status">読み込み中...</div>

  <div class="filter-group" id="filters" style="display:none;">
    <button class="filter-btn active" data-category="all">すべて</button>
    <button class="filter-btn" data-category="coding">コーディング</button>
    <button class="filter-btn" data-category="image">画像生成</button>
    <button class="filter-btn" data-category="video">動画生成</button>
    <button class="filter-btn" data-category="music">音楽生成</button>
  </div>
  <div id="no-results">該当する出来事はまだありません。</div>

  <div id="event-list"></div>
</main>

<script>
  const SUPABASE_URL = "https://azfcbwoxfepemsqsydgc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_XPgx-18pz3WeKdhCycPm5Q_ho3mHF4F";

  const CATEGORY_LABEL = {
    coding: "コーディング",
    image: "画像生成",
    video: "動画生成",
    music: "音楽生成",
  };

  let allEvents = [];
  let currentCategory = "all";

  async function fetchFromSupabase(path) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
      },
    });
    if (!res.ok) {
      throw new Error(`Supabaseからの取得に失敗しました (${res.status})`);
    }
    return res.json();
  }

  function formatDate(dateStr) {
    if (!dateStr) return "時期不明";
    const d = new Date(dateStr);
    return d.toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric" });
  }

  function renderEvents() {
    const listEl = document.getElementById("event-list");
    const noResultsEl = document.getElementById("no-results");

    const filtered =
      currentCategory === "all"
        ? allEvents
        : allEvents.filter((e) => e.category === currentCategory);

    if (filtered.length === 0) {
      listEl.innerHTML = "";
      noResultsEl.style.display = "block";
      return;
    }
    noResultsEl.style.display = "none";

    let html = "";
    for (const e of filtered) {
      html += `
        <div class="event-card">
          <div class="event-top">
            <span class="event-date">${formatDate(e.event_date)}</span>
            <span class="event-badge">${CATEGORY_LABEL[e.category] ?? e.category}</span>
          </div>
          <div class="event-title">${e.title}</div>
          <p class="event-desc">${e.description}</p>
        </div>`;
    }
    listEl.innerHTML = html;
  }

  function setupFilters() {
    const filtersEl = document.getElementById("filters");
    filtersEl.style.display = "flex";

    const buttons = document.querySelectorAll("#filters .filter-btn");
    buttons.forEach((btn) => {
      btn.addEventListener("click", () => {
        buttons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentCategory = btn.dataset.category;
        renderEvents();
      });
    });
  }

  async function main() {
    const statusEl = document.getElementById("status");
    try {
      allEvents = await fetchFromSupabase("industry_events?select=*&order=event_date.desc");
      setupFilters();
      renderEvents();
      statusEl.style.display = "none";
    } catch (err) {
      console.error(err);
      statusEl.textContent = `データの取得に失敗しました: ${err.message}`;
      statusEl.style.color = "#b91c1c";
    }
  }

  main();
</script>

</body>
</html>
